name: Tests

on:
  push:
    branches:
      - master
      - "!dependabot/**"
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE_COV: 24 # The Node.js version to run coverage on

permissions:
  contents: read

jobs:
  run:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install npm dependencies
        run: npm run ci

      - name: Run Jest tests
        run: npm run jest
        if: "!(startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV)"

      - name: Run Jest tests with coverage
        run: npm run jest -- --coverage
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV

      - name: Run Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path-to-lcov: "./.coverage/lcov.info"

  stylelint:
    name: Stylelint ${{ matrix.stylelint }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Use "18" once 18.0.0 is released.
        stylelint: ["16", "17", "18.0.0-next.0"]

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm run ci

      - name: Install stylelint ${{ matrix.stylelint }}
        run: npm install --no-save --ignore-scripts stylelint@${{ matrix.stylelint }}

      - name: Run Jest tests
        run: npm run jest
